<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="scss/main.scss" />
  </head>
  <body>
    <div class="button-section">
      <div class="normal-section">
        <button class="primary default">Label</button>
        <button class="primary small">Label</button>
        <button class="secondary default">Label</button>
        <button class="secondary small">Label</button>
      </div>
      <div class="disbled-section">
        <button disabled class="primary default">Label</button>
        <button disabled class="primary small">Label</button>
        <button disabled class="secondary default">Label</button>
        <button disabled class="secondary small">Label</button>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
